<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>This demo has left the chat | KAE Digital</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: linear-gradient(125deg, #f6ddd1 0%, #eee3f5 48%, #dceae6 100%); color: #171717; font-family: Arial, sans-serif; }
    main { padding: clamp(36px, 7vw, 72px) clamp(24px, 6vw, 64px); margin: 24px; text-align: center; max-width: 760px; background: rgba(255, 252, 247, .72); border: 1px solid rgba(255,255,255,.8); border-radius: 24px; box-shadow: 0 28px 90px rgba(104,77,113,.12); }
    .brand { display: block; margin-bottom: 64px; font-size: 13px; font-weight: 700; letter-spacing: .15em; }
    .wave { display: inline-block; font-size: 58px; transform-origin: 75% 75%; animation: wave 2.5s ease-in-out 3; }
    h1 { font-size: clamp(36px, 7vw, 64px); line-height: 1.05; letter-spacing: -.055em; font-weight: 600; margin: 26px 0 20px; }
    p { color: #69645e; font-size: 18px; line-height: 1.6; margin: 0 0 34px; }
    a { display: inline-block; padding: 17px 24px; background: #3f354c; color: #fff; text-decoration: none; border-radius: 3px; font-weight: 600; transition: transform .2s, background .2s; }
    a:hover { transform: translateY(-3px); background: #64536d; }
    a:focus-visible { outline: 2px solid #171717; outline-offset: 5px; }
    @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(18deg); } 20%, 40% { transform: rotate(-8deg); } }
    @media (prefers-reduced-motion: reduce) { .wave { animation: none; } a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <span class="brand">KAE DIGITAL</span>
    <span class="wave" aria-hidden="true">👋</span>
    <h1>This demo has left the chat.</h1>
    <p>It’s no longer available, but your next website could be.</p>
    <a href="https://kaedigital.co.uk/">Explore KAE Digital ↗</a>
  </main>
</body>
</html>
