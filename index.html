<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Demo unavailable | KAE Digital</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f2efe9; color: #171717; font-family: Arial, sans-serif; }
    main { padding: 48px 24px; text-align: center; max-width: 720px; }
    .brand { display: block; margin-bottom: 64px; font-size: 13px; font-weight: 700; letter-spacing: .15em; }
    h1 { font-size: clamp(36px, 7vw, 64px); line-height: 1.05; letter-spacing: -.055em; font-weight: 600; margin: 26px 0 20px; }
    p { color: #69645e; font-size: 18px; line-height: 1.6; margin: 0 0 34px; }
    a { display: inline-block; padding: 17px 24px; background: linear-gradient(110deg, #7958a1, #a34f75 55%, #b7503d); color: #fff; text-decoration: none; border-radius: 3px; font-weight: 600; transition: transform .2s, background .2s; }
    a:hover { transform: translateY(-3px); filter: brightness(1.08); }
    a:focus-visible { outline: 2px solid #171717; outline-offset: 5px; }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <main>

    <h1>This demo is no longer available.</h1>
    <p>Ready to bring your own website to life?</p>
    <a href="https://kaedigital.co.uk/">Explore KAE Digital</a>
  </main>
</body>
</html>
